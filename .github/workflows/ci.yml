name: Warehouse checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest -q
      - run: rail demo
      - run: python scripts/prepare_powerbi.py
      - name: Verify generated Power Query is current
        run: git diff --exit-code -- powerbi/queries
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-exports
          path: |
            exports/demo/*.csv
            exports/demo/*.json
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swiss-rail:test .
      - run: docker run --rm swiss-rail:test demo --days 3
