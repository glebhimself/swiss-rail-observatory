<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Swiss Rail Observatory architecture</title><desc id="desc">Official source files enter Python ingestion, raw DuckDB tables, dbt staging, a star schema, analytical exports, and Power BI. The local guide presents the source code and explanations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6b8099"/></marker></defs><rect width="1120" height="610" rx="8" fill="#f4f7fa"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1c314b}.label{font-size:19px;font-weight:700}.small{font-size:14px;fill:#536981}.caption{font-size:12px;letter-spacing:1.4px;fill:#a31b2b}.link{fill:none;stroke:#6b8099;stroke-width:2;marker-end:url(#arrow)}</style><text x="36" y="40" class="caption">SWISS RAIL OBSERVATORY / DATA FLOW</text><rect x="36" y="80" width="240" height="115" rx="5" fill="white" stroke="#c9d5e2"/><text x="54" y="111" class="label">Official source files</text><text x="54" y="138" class="small">Transport IST v2 · daily</text><text x="54" y="160" class="small">MeteoSwiss · hourly</text><rect x="322" y="80" width="240" height="115" rx="5" fill="white" stroke="#b82332"/><text x="340" y="111" class="label">Python ingestion</text><text x="340" y="138" class="small">Validate · normalize · retry</text><text x="340" y="160" class="small">Atomic day replacement</text><rect x="608" y="80" width="220" height="115" rx="5" fill="white" stroke="#c9d5e2"/><text x="626" y="111" class="label">DuckDB raw</text><text x="626" y="138" class="small">Stop events + weather</text><text x="626" y="160" class="small">Checksums + load ledger</text><rect x="874" y="80" width="210" height="115" rx="5" fill="white" stroke="#c9d5e2"/><text x="892" y="111" class="label">dbt staging</text><text x="892" y="138" class="small">Deduplicate events</text><text x="892" y="160" class="small">Keep missing values</text><path d="M276 137 L322 137" class="link"/><path d="M562 137 L608 137" class="link"/><path d="M828 137 L874 137" class="link"/><rect x="630" y="274" width="454" height="135" rx="5" fill="white" stroke="#b82332"/><text x="648" y="305" class="label">Tested star schema</text><text x="648" y="332" class="small">fct_stop_event + 5 dimensions</text><text x="648" y="354" class="small">Station · operator · service · date · hour</text><text x="648" y="376" class="small">32 dbt checks + SQL analyses</text><path d="M980 195 L980 274" class="link"/><rect x="322" y="274" width="262" height="135" rx="5" fill="white" stroke="#c9d5e2"/><text x="340" y="305" class="label">CSV exports</text><text x="340" y="332" class="small">Typed schema + audit manifest</text><text x="340" y="354" class="small">Event facts + analytical marts</text><text x="340" y="376" class="small">Separate demo and live folders</text><path d="M630 340 L584 340" class="link"/><rect x="36" y="274" width="240" height="135" rx="5" fill="white" stroke="#c9d5e2"/><text x="54" y="305" class="label">Power BI Desktop</text><text x="54" y="332" class="small">M queries + DAX measures</text><text x="54" y="354" class="small">Operations · weather · quality</text><text x="54" y="376" class="small">Report built on Windows</text><path d="M322 340 L276 340" class="link"/><rect x="36" y="480" width="1048" height="87" rx="5" fill="white" stroke="#c9d5e2"/><text x="54" y="511" class="label">Local build journal</text><text x="54" y="538" class="small">Readable Markdown · highlighted source files · architecture · theory · Windows handoff</text><text x="36" y="597" class="small">Synthetic fixtures run the same pipeline in demo mode. Live findings require official transport data.</text></svg>