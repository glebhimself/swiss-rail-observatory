[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-rail-observatory"
version = "0.1.0"
description = "A reproducible Swiss rail reliability warehouse with weather context and a Power BI handoff."
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.4,<2",
  "dbt-duckdb>=1.9,<2",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
rail = "swiss_rail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

